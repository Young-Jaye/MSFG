dataset:
  name: hbrc
  dataset: HBRC
  n_clusters: 20

preprocessing:
  highly_genes: 3000
  min_cells: 100
  target_sum: 10000.0
  scale_max_value: 10.0
  gft_on_feature: 1

graph:
  gft_fraction_feature: 0.25
  radius: 450.0
  k: 15
  fusion_k: 30
  fusion_t: 20
  spatial_knn_k: 20

model:
  nhid1: 128
  nhid2: 64
  dropout: 0.1
  att_hidden: 16

training:
  epochs: 800
  lr: 0.0005
  weight_decay: 0.0001
  seed: 166081447
  alpha: 2.0
  beta: 0.8
  gamma: 0.05
  lambda_entropy: 0.1
  eval_interval: 25

provenance:
  generated_at: "2026-02-01 11:00:12"
  source_dataset_path: original project data/Human_Breast_Cancer
  note: Best HBRC parameters supplied for the manuscript.
